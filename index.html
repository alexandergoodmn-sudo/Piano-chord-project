<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Piano Chord Generator</title>
<script src="https://unpkg.com/vexflow@3.0.9/releases/vexflow-min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
  background: #fff;
  color: #111;
}

#app {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  width: 100%;
}

/* ── Fixed header: staff + divider ── */
#fixed-top {
  flex-shrink: 0;
}

#staff-area {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  background: #fff;
  padding: 6px 0 4px;
  border-bottom: 1px solid #ddd;
}

#notation {
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 172px; /* prevents scroll-anchor defeat when SVG rebuilds */
}

#notation svg {
  display: block;
  max-width: 100%;
}

#chord-label {
  font-size: 13px;
  font-weight: 600;
  color: #444;
  min-height: 17px;
  text-align: center;
  margin-top: 1px;
}

#nav-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 3px;
}

.nav-arrow {
  width: 32px;
  height: 32px;
  border: 1.5px solid #bbb;
  border-radius: 6px;
  background: #f6f6f6;
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #333;
  -webkit-tap-highlight-color: transparent;
  line-height: 1;
}

.nav-arrow:active { background: #e0e0e0; }
.nav-arrow:disabled { opacity: 0.35; cursor: default; }

#measure-counter {
  font-size: 12px;
  color: #777;
  min-width: 100px;
  text-align: center;
  letter-spacing: 0.1px;
}

/* ── Divider / generate row ── */
#divider-box {
  height: 76px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 14px;
  background: #f3f3f3;
  border-top: 1.5px solid #ccc;
  border-bottom: 1.5px solid #ccc;
}

.side-btn {
  min-width: 66px;
  height: 36px;
  border: 1.5px solid #bbb;
  border-radius: 8px;
  background: #fff;
  font-size: 11px;
  font-weight: 700;
  color: #333;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  padding: 0 8px;
  letter-spacing: 0.2px;
}

.side-btn:active { background: #e8e8e8; }
.side-btn.toggled { background: #111; color: #fff; border-color: #111; }
.side-btn.toggled:active { background: #333; }

#generate-btn {
  flex: 1;
  max-width: 148px;
  height: 60px;
  margin: 0 10px;
  background: #111;
  color: #fff;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  letter-spacing: 0.3px;
  -webkit-tap-highlight-color: transparent;
}

#generate-btn:active { background: #333; }

/* ── Scrollable slider area ── */
#slider-scroll {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 20px 16px 28px;
}

.section-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: #bbb;
  margin-bottom: 14px;
}

.slider-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 20px;
}

.slider-row input[type="checkbox"] {
  width: 18px;
  height: 18px;
  min-width: 18px;
  cursor: pointer;
  accent-color: #111;
}

.slider-name {
  font-size: 13px;
  font-weight: 600;
  color: #222;
  min-width: 72px;
}

.slider-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.slider-wrap input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  cursor: pointer;
  height: 45px;
  background: transparent;
}

.slider-wrap input[type="range"]::-webkit-slider-runnable-track {
  height: 45px;
  border-radius: 22px;
  background: linear-gradient(
    transparent calc(50% - 3px),
    #ccc       calc(50% - 3px),
    #ccc       calc(50% + 3px),
    transparent calc(50% + 3px)
  );
}

.slider-wrap input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 45px;
  height: 45px;
  margin-top: 0;
  /* visible circle is 28px (62% of 45px); outer ring is transparent but still touchable */
  background: radial-gradient(circle, #111 62%, transparent 62%);
  border-radius: 50%;
  cursor: pointer;
}

.slider-wrap input[type="range"]::-moz-range-track {
  height: 6px;
  background: #ccc;
  border-radius: 3px;
}

.slider-wrap input[type="range"]::-moz-range-thumb {
  width: 28px;
  height: 28px;
  background: #111;
  border-radius: 50%;
  border: none;
  cursor: pointer;
  /* Firefox doesn't support radial-gradient hitbox trick; 28px visual is close enough */
}

.tick-row {
  display: flex;
  justify-content: space-between;
  padding: 0 6px;
}

.tick-row span {
  font-size: 11px;
  color: #aaa;
  font-weight: 500;
}

.beat-ticks span {
  font-size: 18px;
  color: #aaa;
  line-height: 1;
}

.slider-current {
  font-size: 15px;
  font-weight: 700;
  color: #111;
  min-width: 22px;
  text-align: right;
}

/* ── Genre menu overlay ── */
#genre-menu {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.35);
  z-index: 200;
  align-items: center;
  justify-content: center;
}

#genre-panel {
  background: #fff;
  border-radius: 14px;
  padding: 18px 20px 20px;
  min-width: 180px;
  box-shadow: 0 6px 30px rgba(0,0,0,0.2);
}

.genre-title {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: #bbb;
  margin-bottom: 12px;
  text-align: center;
}

.genre-option {
  display: block;
  width: 100%;
  padding: 13px;
  background: #f6f6f6;
  border: 1.5px solid #ddd;
  border-radius: 8px;
  font-size: 15px;
  font-weight: 600;
  color: #111;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  text-align: center;
}

.genre-option:active { background: #e0e0e0; }

/* ── Note-accidental buttons ── */
.acc-row {
  display: flex;
  flex: 1;
  gap: 4px;
}

.acc-btn {
  flex: 1;
  height: 40px;
  border: 1.5px solid #ddd;
  border-radius: 7px;
  background: #f6f6f6;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  color: #333;
  padding: 0;
}

.acc-btn.sharp { background: #111; color: #fff; border-color: #111; }
.acc-btn.flat  { background: #555; color: #fff; border-color: #555; }
.acc-btn:active { opacity: 0.7; }

/* ── Landscape/wide mode ── */
#landscape-btn { min-width: 46px; font-size: 10px; }

body.landscape {
  overflow: hidden;
}
/* Rotate the entire app 90° CW, sized to fill the portrait viewport sideways */
body.landscape #app {
  position: fixed;
  width: 100vh;
  height: 100vw;
  top: calc(50vh - 50vw);
  left: calc(50vw - 50vh);
  transform: rotate(90deg);
  transform-origin: center center;
  overflow: hidden;
}
body.landscape #slider-scroll { display: none; }
</style>
</head>
<body>
<div id="app">

  <div id="fixed-top">
    <div id="staff-area">
      <div id="notation"></div>
      <div id="nav-row" style="display:none">
        <button class="nav-arrow" id="prev-btn" disabled>&#8592;</button>
        <span id="measure-counter">Tap Generate</span>
        <button class="nav-arrow" id="next-btn" disabled>&#8594;</button>
      </div>
    </div>
    <div id="divider-box">
      <button class="side-btn" id="genre-btn">Genre</button>
      <button id="generate-btn">Generate</button>
      <button class="side-btn" id="landscape-btn">Wide</button>
      <button class="side-btn" id="mode-btn">Standalone</button>
    </div>
  </div>

  <div id="slider-scroll">
    <div class="section-label">Settings</div>
    <div class="slider-row">
      <input type="checkbox" id="lock-measures" title="Lock this value">
      <span class="slider-name">Measures</span>
      <div class="slider-wrap">
        <input type="range" id="measures-range" min="0" max="2" step="1" value="1">
        <div class="tick-row">
          <span>3</span><span>4</span><span>8</span>
        </div>
      </div>
      <span class="slider-current" id="measures-val">4</span>
    </div>
    <div class="slider-row">
      <input type="checkbox" id="lock-onsets" title="Lock this value">
      <span class="slider-name">Onsets</span>
      <div class="slider-wrap">
        <input type="range" id="onsets-range" min="1" max="8" step="1" value="1">
        <div class="tick-row">
          <span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span>
        </div>
      </div>
      <span class="slider-current" id="onsets-val">1</span>
    </div>
    <div class="slider-row">
      <input type="checkbox" id="lock-density" title="Lock this value">
      <span class="slider-name">Density</span>
      <div class="slider-wrap">
        <input type="range" id="density-range" min="1" max="5" step="1" value="3">
        <div class="tick-row">
          <span>1</span><span>2</span><span>3</span><span>4</span><span>5</span>
        </div>
      </div>
      <span class="slider-current" id="density-val">3</span>
    </div>
    <div class="slider-row">
      <input type="checkbox" id="lock-voicing" title="Lock this value">
      <span class="slider-name">Spread</span>
      <div class="slider-wrap">
        <input type="range" id="spread-range" min="0" max="6" step="1" value="3">
        <div class="tick-row">
          <span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span>
        </div>
      </div>
      <span class="slider-current" id="spread-val">5</span>
    </div>
    <div class="slider-row">
      <input type="checkbox" style="visibility:hidden; min-width:18px">
      <span class="slider-name">Range</span>
      <div class="slider-wrap">
        <input type="range" id="note-range" min="0" max="4" step="1" value="4">
        <div class="tick-row">
          <span>Staff</span><span>+1</span><span>+2</span><span>+3</span><span>Any</span>
        </div>
      </div>
      <span class="slider-current" id="note-range-val">Any</span>
    </div>
    <div class="slider-row">
      <input type="checkbox" id="lock-beat" title="Lock this value">
      <span class="slider-name">Beat type</span>
      <div class="slider-wrap">
        <input type="range" id="beat-range" min="0" max="5" step="1" value="0">
        <div class="tick-row beat-ticks">
          <span title="Whole note">w</span>
          <span title="Half note">h</span>
          <span title="Quarter note">&#9833;</span>
          <span title="Eighth note">&#9834;</span>
          <span title="Sixteenth note">&#9836;</span>
          <span>X</span>
        </div>
      </div>
      <span class="slider-current" id="beat-val">w</span>
    </div>
    <div class="slider-row">
      <input type="checkbox" id="lock-key" title="Lock this value">
      <span class="slider-name">Key</span>
      <div class="slider-wrap">
        <input type="range" id="key-range" min="0" max="12" step="1" value="0">
        <div class="tick-row">
          <span>C</span><span>D&#9837;</span><span>D</span><span>E&#9837;</span><span>E</span><span>F</span><span>F&#9839;</span><span>G</span><span>A&#9837;</span><span>A</span><span>B&#9837;</span><span>B</span><span>X</span>
        </div>
      </div>
      <span class="slider-current" id="key-val">C</span>
    </div>
    <div class="slider-row">
      <input type="checkbox" style="visibility:hidden; min-width:18px">
      <span class="slider-name">Staff</span>
      <div class="slider-wrap">
        <input type="range" id="staff-range" min="0" max="2" step="1" value="1">
        <div class="tick-row">
          <span>Treble</span><span>Both</span><span>Bass</span>
        </div>
      </div>
      <span class="slider-current" id="staff-val">Both</span>
    </div>
    <div class="slider-row">
      <input type="checkbox" id="lock-acc" title="Lock this value">
      <span class="slider-name">Keys</span>
      <div class="acc-row">
        <button class="acc-btn" data-note="A">A</button>
        <button class="acc-btn" data-note="B">B</button>
        <button class="acc-btn" data-note="C">C</button>
        <button class="acc-btn" data-note="D">D</button>
        <button class="acc-btn" data-note="E">E</button>
        <button class="acc-btn" data-note="F">F</button>
        <button class="acc-btn" data-note="G">G</button>
      </div>
    </div>
  </div>

</div>

<!-- Genre menu -->
<div id="genre-menu">
  <div id="genre-panel">
    <div class="genre-title">Genre</div>
    <button class="genre-option" id="genre-normal">Normal</button>
  </div>
</div>

<script>
(function () {
'use strict';

// ────────────────────────────────────────────────────────────
// MUSIC ENGINE
// ────────────────────────────────────────────────────────────

// C major diatonic chords. v[0..4] = voicings for density 1-5.
// density 1=root, 2=root+5th, 3=triad, 4=7th chord, 5=9th chord (rootless treble)
const CHORDS = [
  { name: 'Cmaj7', roman: 'I',
    v:     [['c/4'],['c/4','g/4'],['c/4','e/4','g/4'],['c/4','e/4','g/4','b/4'],['e/4','g/4','b/4','d/5']],
    v_alt: [['c/4','e/4'],['c/4','f/4'],['c/4','g/4'],['c/4','a/4']],
    bass: ['c/3'] },
  { name: 'Dm7',  roman: 'ii',
    v:     [['d/4'],['d/4','a/4'],['d/4','f/4','a/4'],['d/4','f/4','a/4','c/5'],['f/4','a/4','c/5','e/5']],
    v_alt: [['d/4','f/4'],['d/4','g/4'],['d/4','a/4'],['d/4','b/4']],
    bass: ['d/3'] },
  { name: 'Em7',  roman: 'iii',
    v:     [['e/4'],['e/4','b/4'],['e/4','g/4','b/4'],['e/4','g/4','b/4','d/5'],['g/4','b/4','d/5','f/5']],
    v_alt: [['e/4','g/4'],['e/4','a/4'],['e/4','b/4'],['e/4','c/5']],
    bass: ['e/3'] },
  { name: 'Fmaj7', roman: 'IV',
    v:     [['f/4'],['f/4','c/5'],['f/4','a/4','c/5'],['f/4','a/4','c/5','e/5'],['a/4','c/5','e/5','g/5']],
    v_alt: [['f/4','a/4'],['f/4','b/4'],['f/4','c/5'],['f/4','d/5']],
    bass: ['f/3'] },
  { name: 'G7',   roman: 'V',
    v:     [['g/4'],['g/4','d/5'],['g/4','b/4','d/5'],['g/4','b/4','d/5','f/5'],['b/4','d/5','f/5','a/5']],
    v_alt: [['g/4','b/4'],['g/4','c/5'],['g/4','d/5'],['g/4','e/5']],
    bass: ['g/2'] },
  { name: 'Am7',  roman: 'vi',
    v:     [['a/4'],['a/4','e/5'],['a/4','c/5','e/5'],['a/4','c/5','e/5','g/5'],['c/5','e/5','g/5','b/5']],
    v_alt: [['a/4','c/5'],['a/4','d/5'],['a/4','e/5'],['a/4','f/5']],
    bass: ['a/2'] },
  { name: 'Bm7b5', roman: 'vii°',
    v:     [['b/4'],['b/4','f/5'],['b/4','d/5','f/5'],['b/4','d/5','f/5','a/5'],['b/4','d/5','f/5','a/5']],
    v_alt: [['b/4','d/5'],['b/4','e/5'],['b/4','f/5'],['b/4','g/5']],
    bass: ['b/2'] },
];

function chordName(chord, density) {
  if (density <= 2) return chord.roman;
  if (density === 3) return chord.name.replace('maj7','').replace('m7b5','°').replace('7','');
  return chord.name;
}

// Progression templates — indices into CHORDS (C major scale degrees 0-6)
// Markov transition table: CHORDS index → valid next chord indices
const TRANSITIONS = [
  [1, 3, 4, 5, 6],  // I   → ii, IV, V, vi, vii
  [4, 0],            // ii  → V, I
  [3, 5],            // iii → IV, vi
  [0, 1, 4],         // IV  → I, ii, V
  [0, 5],            // V   → I, vi
  [1, 2, 4],         // vi  → ii, iii, V
  [4],               // vii → V
];

// ── Key transposition ──────────────────────────────────────────
const KEYS = [
  { name: 'C',  semi: 0,  flats: false },
  { name: 'Db', semi: 1,  flats: true  },
  { name: 'D',  semi: 2,  flats: false },
  { name: 'Eb', semi: 3,  flats: true  },
  { name: 'E',  semi: 4,  flats: false },
  { name: 'F',  semi: 5,  flats: true  },
  { name: 'F#', semi: 6,  flats: false },
  { name: 'G',  semi: 7,  flats: false },
  { name: 'Ab', semi: 8,  flats: true  },
  { name: 'A',  semi: 9,  flats: false },
  { name: 'Bb', semi: 10, flats: true  },
  { name: 'B',  semi: 11, flats: false },
];
const CHROM_S = ['c','c#','d','d#','e','f','f#','g','g#','a','a#','b'];
const CHROM_F = ['c','db','d','eb','e','f','gb','g','ab','a','bb','b'];

function transposeNote(vfNote, semi, flats) {
  const slash = vfNote.indexOf('/');
  const name = vfNote.slice(0, slash);
  const oct  = parseInt(vfNote.slice(slash + 1));
  const ref  = flats ? CHROM_F : CHROM_S;
  const idx  = ref.indexOf(name);
  if (idx === -1) return vfNote;
  const total = idx + semi;
  const newIdx = ((total % 12) + 12) % 12;
  const newOct = oct + Math.floor(total / 12);
  return ref[newIdx] + '/' + newOct;
}

function chordsForKey(keyIdx) {
  const { semi, flats } = KEYS[keyIdx];
  if (semi === 0) return CHORDS;
  return CHORDS.map(ch => ({
    name:  ch.name, roman: ch.roman,
    v:     ch.v.map(voi => voi.map(n => transposeNote(n, semi, flats))),
    v_alt: ch.v_alt.map(voi => voi.map(n => transposeNote(n, semi, flats))),
    bass:  ch.bass.map(n => transposeNote(n, semi, flats)),
  }));
}

// Weighted random value centred on `target`, clamped to [min, max]
// Distribution: 55% exact, 15% ±1, 7.5% ±2 (symmetric)
function weightedRandom(target, min, max) {
  const r = Math.random();
  if (r < 0.55)  return target;
  if (r < 0.70)  return Math.max(min, target - 1);
  if (r < 0.85)  return Math.min(max, target + 1);
  if (r < 0.925) return Math.max(min, target - 2);
  return Math.min(max, target + 2);
}

// Weighted random onset count centred on `target` (used when lock is off)
function randomOnsets(target) {
  return weightedRandom(target, 1, 8);
}

// Weighted random beat type centred on `baseDur` (used when beat lock is off)
function randomBeatType(baseDur) {
  const BEAT_DURATIONS = ['w','h','q','8','16'];
  const idx = BEAT_DURATIONS.indexOf(baseDur);
  return BEAT_DURATIONS[weightedRandom(idx === -1 ? 0 : idx, 0, 4)];
}

// Returns array-of-arrays: measures[m] = [chord, ...]
// When lockOnsets is true every measure has exactly numOnsets chords.
// When false each measure gets a random count weighted toward numOnsets.
function generateProgression(numMeasures, numOnsets, lockOnsets, keyIndex, lockKey) {
  const measures = [];
  let cur = 0; // start on I
  for (let m = 0; m < numMeasures; m++) {
    const count   = lockOnsets ? numOnsets : randomOnsets(numOnsets);
    const mKeyIdx = keyIndex === 12
      ? Math.floor(Math.random() * 12)
      : (lockKey ? keyIndex : weightedRandom(keyIndex, 0, 11));
    const chords  = chordsForKey(mKeyIdx);
    const measure = [chords[cur]];
    for (let o = 1; o < count; o++) {
      const opts = TRANSITIONS[cur];
      let next;
      do { next = opts[Math.floor(Math.random() * opts.length)]; } while (opts.length > 1 && next === cur);
      cur = next;
      measure.push(chords[cur]);
    }
    const opts = TRANSITIONS[cur];
    cur = opts[Math.floor(Math.random() * opts.length)];
    measures.push(measure);
  }
  return measures;
}

// ────────────────────────────────────────────────────────────
// STATE
// ────────────────────────────────────────────────────────────

const MEASURE_STOPS = [3, 4, 8];

const state = {
  numMeasures: 4,
  numOnsets: 1,
  chordDensity: 3,
  lockDensity: false,
  spreadIndex: 3,
  lockVoicing: false,
  beatType: 'w',
  lockBeat: false,
  lockMeasures: false,
  lockOnsets: false,
  keyIndex: 0,
  lockKey: false,
  noteAccidentals: { A: 0, B: 0, C: 0, D: 0, E: 0, F: 0, G: 0 },
  lockAccidentals: false,
  staffMode: 1, // 0 = treble only, 1 = both, 2 = bass only
  landscapeMode: false,
  noteRange: 4, // 0=staff only … 3=3 ledger lines, 4=any
  currentIdx: 0,
  measures: null, // array of arrays: [[chord,...], ...]
};

// Strips any existing accidental from transposition and replaces with the target.
function applyAccidental(vfNote) {
  const letter = vfNote[0].toUpperCase();
  const val = state.noteAccidentals[letter];
  if (!val) return vfNote;
  const slash = vfNote.indexOf('/');
  const acc = val === 1 ? '#' : 'b';
  if (state.lockAccidentals || Math.random() < 0.55) {
    return vfNote[0] + acc + vfNote.slice(slash);
  }
  return vfNote;
}

// ────────────────────────────────────────────────────────────
// VEXFLOW RENDERING
// ────────────────────────────────────────────────────────────

const VF = Vex.Flow;

// ── Note range helpers ────────────────────────────────────────
// Bounds: [lo, hi] MIDI values per range index per clef.
// Treble staff: E4(64)–F5(77). Bass staff: G2(43)–A3(57).
const TREBLE_BOUNDS = [[64,77],[62,79],[60,81],[57,84]];
const BASS_BOUNDS   = [[43,57],[41,59],[40,60],[38,62]];
const MIDI_SEMIS = {'c':0,'c#':1,'db':1,'d':2,'d#':3,'eb':3,'e':4,'e#':5,
                    'f':5,'f#':6,'gb':6,'g':7,'g#':8,'ab':8,'a':9,'a#':10,'bb':10,'b':11,'cb':11};

function noteToMidi(vfNote) {
  const slash = vfNote.indexOf('/');
  const semi  = MIDI_SEMIS[vfNote.slice(0, slash).toLowerCase()] || 0;
  return (parseInt(vfNote.slice(slash + 1)) + 1) * 12 + semi;
}

function clampToRange(vfNote, clef) {
  if (state.noteRange >= 4) return vfNote;
  const [lo, hi] = (clef === 'bass' ? BASS_BOUNDS : TREBLE_BOUNDS)[state.noteRange];
  const slash = vfNote.indexOf('/');
  const name = vfNote.slice(0, slash);
  let oct = parseInt(vfNote.slice(slash + 1));
  let m = noteToMidi(vfNote);
  if (m < lo) { while (m < lo) { m += 12; oct++; } if (m > hi) { m -= 12; oct--; } }
  else if (m > hi) { while (m > hi) { m -= 12; oct--; } if (m < lo) { m += 12; oct++; } }
  return name + '/' + oct;
}

function rangeKeys(keys, clef) {
  if (state.noteRange >= 4) return keys;
  const seen = new Set();
  return keys
    .map(n => clampToRange(n, clef))
    .sort((a, b) => noteToMidi(a) - noteToMidi(b))
    .filter(n => { const m = noteToMidi(n); if (seen.has(m)) return false; seen.add(m); return true; });
}

function staffWidth() {
  const el = document.getElementById('notation');
  const viewW = el.parentElement.clientWidth - 16;
  if (state.landscapeMode) return Math.round(viewW * 0.94);
  const base = Math.min(viewW, 330);
  return (state.numMeasures === 4 || state.numMeasures === 8) ? Math.round(base * 0.86) : base;
}

// measureArr: array of 1 or 2 chord-arrays (one per measure).
function renderStaff(measureArr, duration, density) {
  const container = document.getElementById('notation');
  container.innerHTML = '';

  const W = staffWidth();
  const singleStaff = state.staffMode !== 1;
  const H = singleStaff ? 120 : 210;
  const TREBLE_Y = 5;
  const BASS_Y   = 88;
  const staveX = 16;
  const staveW = W - 20;
  const dur = duration || 'w';
  const di  = Math.min(Math.max((density || 3), 1), 5) - 1;

  container.style.minHeight = (H - 38) + 'px';

  const renderer = new VF.Renderer(container, VF.Renderer.Backends.SVG);
  renderer.resize(W, H);
  const ctx = renderer.getContext();
  ctx.setFont('Arial', 10, '');

  function drawNotes(staveT, staveB, chords) {
    if (!chords || !chords.length) return;
    const chordDurs = chords.map(() => {
      if (dur === 'x') return BEAT_DURATIONS[Math.floor(Math.random() * BEAT_DURATIONS.length)];
      return state.lockBeat ? dur : randomBeatType(dur);
    });
    if (staveT) {
      const tN = chords.map((c, i) => {
        const d = state.lockDensity
          ? di
          : Math.min(Math.max(weightedRandom(state.chordDensity, 1, 5), 1), 5) - 1;
        let rawVoicing;
        if (d === 1) {
          // Density 2: root + chosen interval above
          const SPREAD_SEMIS = [2, 4, 5, 7, 9, 11, 12]; // maj2, maj3, p4, p5, maj6, maj7, oct
          const si   = state.lockVoicing ? state.spreadIndex : weightedRandom(state.spreadIndex, 0, 6);
          const semi = SPREAD_SEMIS[Math.min(si, 6)];
          const root = c.v[0][0];
          const useFl = state.keyIndex < 12 ? KEYS[state.keyIndex].flats : false;
          rawVoicing = [root, transposeNote(root, semi, useFl)];
        } else {
          rawVoicing = c.v[d];
        }
        const raw = rawVoicing.map(applyAccidental);
        const keys = rangeKeys(raw, 'treble');
        return new VF.StaveNote({ clef: 'treble', keys: keys.length ? keys : raw.slice(0, 1), duration: chordDurs[i] });
      });
      VF.Formatter.FormatAndDraw(ctx, staveT, tN);
    }
    if (staveB) {
      const bN = chords.map((c, i) => {
        const raw  = c.bass.map(applyAccidental);
        const keys = rangeKeys(raw, 'bass');
        return new VF.StaveNote({ clef: 'bass', keys: keys.length ? keys : raw.slice(0, 1), duration: chordDurs[i] });
      });
      VF.Formatter.FormatAndDraw(ctx, staveB, bN);
    }
  }

  function connect(t, b, type) {
    const sc = new VF.StaveConnector(t, b);
    sc.setType(type);
    sc.setContext(ctx).draw();
  }

  const numUp = measureArr ? measureArr.length : 1;

  // Adds custom key signature accidentals (any combination) to a stave.
  // Uses treble-clef positions; VexFlow's convertAccLines applies the bass-clef offset (+1) automatically.
  function addCustomKeySig(stave) {
    const sharpOrder = ['F','C','G','D','A','E','B'];
    const flatOrder  = ['B','E','A','D','G','C','F'];
    const sharpLines = [0, 1.5, -0.5, 1, 2.5, 0.5, 2];
    const flatLines  = [2, 0.5, 2.5, 1, 3, 1.5, 3.5];
    const customList = [];
    sharpOrder.forEach(function(n, i) {
      if (state.noteAccidentals[n] === 1)  customList.push({ type: '#', line: sharpLines[i] });
    });
    flatOrder.forEach(function(n, i) {
      if (state.noteAccidentals[n] === -1) customList.push({ type: 'b', line: flatLines[i] });
    });
    if (!customList.length) return;

    const ks = new VF.KeySignature('C');
    ks.format = function () {
      if (this.formatted) return;
      if (!this.stave) return;
      this.width = 0;
      this.glyphs = [];
      this.xPositions = [0];
      this.accList = customList.map(function(a) { return { type: a.type, line: a.line }; });
      var firstType = this.accList[0].type;
      var clef = this.stave.clef || 'treble';
      this.convertAccLines(clef, firstType, this.accList);
      for (var i = 0; i < this.accList.length; i++) {
        this.convertToGlyph(this.accList[i], this.accList[i + 1]);
      }
      this.formatted = true;
    };
    stave.addModifier(ks, 5); // 5 = StaveModifier.Position.BEGIN
  }

  const segW = numUp > 1 ? Math.floor(staveW / numUp) : staveW;
  const NONE = (VF.Barline && VF.Barline.type && VF.Barline.type.NONE) || 7;

  if (singleStaff) {
    const clef = state.staffMode === 0 ? 'treble' : 'bass';
    const staves = [];
    for (let i = 0; i < numUp; i++) {
      const s = new VF.Stave(staveX + i * segW, TREBLE_Y, segW).setContext(ctx);
      if (i === 0) { s.addClef(clef); addCustomKeySig(s); }
      else s.setBegBarType(NONE);
      s.draw();
      staves.push(s);
    }
    for (let i = 0; i < numUp; i++) {
      if (measureArr && measureArr[i] && measureArr[i].length) {
        drawNotes(
          state.staffMode === 0 ? staves[i] : null,
          state.staffMode === 2 ? staves[i] : null,
          measureArr[i]
        );
      }
    }
  } else {
    const trebles = [], basses = [];
    for (let i = 0; i < numUp; i++) {
      const x = staveX + i * segW;
      const t = new VF.Stave(x, TREBLE_Y, segW).setContext(ctx);
      const b = new VF.Stave(x, BASS_Y,   segW).setContext(ctx);
      if (i === 0) { t.addClef('treble'); b.addClef('bass'); addCustomKeySig(t); addCustomKeySig(b); }
      else { t.setBegBarType(NONE); b.setBegBarType(NONE); }
      t.draw(); b.draw();
      trebles.push(t); basses.push(b);
    }
    connect(trebles[0], basses[0], VF.StaveConnector.type.BRACE);
    connect(trebles[0], basses[0], VF.StaveConnector.type.SINGLE_LEFT);
    for (let i = 0; i < numUp; i++) {
      connect(trebles[i], basses[i], VF.StaveConnector.type.SINGLE_RIGHT);
    }
    for (let i = 0; i < numUp; i++) {
      if (measureArr && measureArr[i] && measureArr[i].length) {
        drawNotes(trebles[i], basses[i], measureArr[i]);
      }
    }
  }

  // Trim dead space: VexFlow's internal offset pushes stave content ~38px below y=0.
  // Shift the viewBox up so the staff fills from the top of the SVG element.
  const TOP_TRIM = 38;
  const SHOW_H   = H - TOP_TRIM;
  const svg = container.querySelector('svg');
  svg.setAttribute('viewBox', `0 ${TOP_TRIM} ${W} ${SHOW_H}`);
  svg.setAttribute('height', SHOW_H);

}

// ────────────────────────────────────────────────────────────
// UI
// ────────────────────────────────────────────────────────────

const measuresRange = document.getElementById('measures-range');
const measuresValEl  = document.getElementById('measures-val');
const lockMeasuresEl = document.getElementById('lock-measures');
const onsetsRange    = document.getElementById('onsets-range');
const onsetsValEl    = document.getElementById('onsets-val');
const lockOnsetsEl   = document.getElementById('lock-onsets');
const generateBtn    = document.getElementById('generate-btn');
const prevBtn        = document.getElementById('prev-btn');
const nextBtn        = document.getElementById('next-btn');
const counterEl      = document.getElementById('measure-counter');

function navStep() {
  if (state.landscapeMode) return state.numMeasures === 8 ? 4 : 2;
  return state.numMeasures === 8 ? 2 : 1;
}

function updateNavButtons() {
  const has  = !!state.measures;
  const step = navStep();
  prevBtn.disabled = !has || state.currentIdx === 0;
  nextBtn.disabled = !has || state.currentIdx >= state.measures.length - step;
}

function showMeasure(idx) {
  const dur  = state.beatType;
  const step = navStep();
  const measureArr = [];
  for (let i = 0; i < step; i++) measureArr.push(state.measures[idx + i] || []);
  const counter = step === 1
    ? 'Measure ' + (idx + 1) + ' of ' + state.measures.length
    : 'Measures ' + (idx + 1) + '-' + (idx + step) + ' of ' + state.measures.length;

  renderStaff(measureArr, dur, state.chordDensity);
  counterEl.textContent = counter;
  updateNavButtons();
}

measuresRange.addEventListener('input', function () {
  state.numMeasures = MEASURE_STOPS[parseInt(this.value)];
  measuresValEl.textContent = state.numMeasures;
});

lockMeasuresEl.addEventListener('change', function () {
  state.lockMeasures = this.checked;
});

generateBtn.addEventListener('click', function () {
  state.measures   = generateProgression(state.numMeasures, state.numOnsets, state.lockOnsets, state.keyIndex, state.lockKey);
  state.currentIdx = 0;
  showMeasure(0);
});

prevBtn.addEventListener('click', function () {
  if (!state.measures || state.currentIdx <= 0) return;
  state.currentIdx -= navStep();
  showMeasure(state.currentIdx);
});

nextBtn.addEventListener('click', function () {
  const step = navStep();
  if (!state.measures || state.currentIdx >= state.measures.length - step) return;
  state.currentIdx += step;
  showMeasure(state.currentIdx);
});

onsetsRange.addEventListener('input', function () {
  state.numOnsets = parseInt(this.value);
  onsetsValEl.textContent = state.numOnsets;
  if (state.measures) showMeasure(state.currentIdx);
});

lockOnsetsEl.addEventListener('change', function () {
  state.lockOnsets = this.checked;
});

const densityRange   = document.getElementById('density-range');
const densityValEl   = document.getElementById('density-val');
const lockDensityEl  = document.getElementById('lock-density');

densityRange.addEventListener('input', function () {
  state.chordDensity = parseInt(this.value);
  densityValEl.textContent = state.chordDensity;
  if (state.measures) showMeasure(state.currentIdx);
});

lockDensityEl.addEventListener('change', function () {
  state.lockDensity = this.checked;
});

const SPREAD_LABELS = ['2', '3', '4', '5', '6', '7', '8'];
const spreadRange   = document.getElementById('spread-range');
const spreadValEl   = document.getElementById('spread-val');
const lockVoicingEl = document.getElementById('lock-voicing');

spreadRange.addEventListener('input', function () {
  state.spreadIndex = parseInt(this.value);
  spreadValEl.textContent = SPREAD_LABELS[state.spreadIndex];
  if (state.measures) showMeasure(state.currentIdx);
  else renderStaff(null);
});

lockVoicingEl.addEventListener('change', function () {
  state.lockVoicing = this.checked;
});

const RANGE_LABELS  = ['Staff', '+1', '+2', '+3', 'Any'];
const noteRangeEl   = document.getElementById('note-range');
const noteRangeValEl = document.getElementById('note-range-val');

noteRangeEl.addEventListener('input', function () {
  state.noteRange = parseInt(this.value);
  noteRangeValEl.textContent = RANGE_LABELS[state.noteRange];
  if (state.measures) showMeasure(state.currentIdx);
  else renderStaff(null);
});

const BEAT_DURATIONS = ['w','h','q','8','16'];
const BEAT_LABELS    = ['w','h','♩','♪','♬'];
const beatRange  = document.getElementById('beat-range');
const beatValEl  = document.getElementById('beat-val');
const lockBeatEl = document.getElementById('lock-beat');

beatRange.addEventListener('input', function () {
  const idx = parseInt(this.value);
  if (idx === 5) {
    state.beatType = 'x';
    beatValEl.textContent = 'X';
  } else {
    state.beatType = BEAT_DURATIONS[idx];
    beatValEl.textContent = BEAT_LABELS[idx];
  }
  if (state.measures) showMeasure(state.currentIdx);
});

lockBeatEl.addEventListener('change', function () {
  state.lockBeat = this.checked;
});

const keyRange  = document.getElementById('key-range');
const keyValEl  = document.getElementById('key-val');
const lockKeyEl = document.getElementById('lock-key');

keyRange.addEventListener('input', function () {
  state.keyIndex = parseInt(this.value);
  keyValEl.textContent = state.keyIndex === 12 ? 'X' : KEYS[state.keyIndex].name;
});

lockKeyEl.addEventListener('change', function () {
  state.lockKey = this.checked;
});

const STAFF_LABELS = ['Treble', 'Both', 'Bass'];
const staffRange   = document.getElementById('staff-range');
const staffValEl   = document.getElementById('staff-val');

staffRange.addEventListener('input', function () {
  state.staffMode = parseInt(this.value);
  staffValEl.textContent = STAFF_LABELS[state.staffMode];
  if (state.measures) showMeasure(state.currentIdx);
  else renderStaff(null);
});

const lockAccEl = document.getElementById('lock-acc');

lockAccEl.addEventListener('change', function () {
  state.lockAccidentals = this.checked;
});

document.querySelectorAll('.acc-btn').forEach(function (btn) {
  btn.addEventListener('click', function () {
    const note = this.dataset.note;
    const cur  = state.noteAccidentals[note];
    const next = cur === 0 ? 1 : cur === 1 ? -1 : 0;
    state.noteAccidentals[note] = next;
    if (next === 0) {
      this.textContent = note;
      this.className = 'acc-btn';
    } else if (next === 1) {
      this.textContent = note + '#';
      this.className = 'acc-btn sharp';
    } else {
      this.textContent = note + 'b';
      this.className = 'acc-btn flat';
    }
    if (state.measures) showMeasure(state.currentIdx);
    else renderStaff(null); // update key sig on blank staff
  });
});

document.getElementById('landscape-btn').addEventListener('click', function () {
  state.landscapeMode = !state.landscapeMode;
  this.classList.toggle('toggled', state.landscapeMode);
  document.body.classList.toggle('landscape', state.landscapeMode);
  // Clamp currentIdx so it aligns with the new step
  const step = navStep();
  state.currentIdx = Math.floor(state.currentIdx / step) * step;
  if (state.measures) showMeasure(state.currentIdx);
  else renderStaff(null);
});

document.getElementById('mode-btn').addEventListener('click', function () {
  this.classList.toggle('toggled');
  document.getElementById('nav-row').style.display = this.classList.contains('toggled') ? 'flex' : 'none';
});

// ── Genre menu ────────────────────────────────────────────────
const genreMenu = document.getElementById('genre-menu');

document.getElementById('genre-btn').addEventListener('click', function () {
  genreMenu.style.display = 'flex';
});

genreMenu.addEventListener('click', function (e) {
  if (e.target === this) this.style.display = 'none';
});

document.getElementById('genre-normal').addEventListener('click', function () {
  // Measures → 4
  measuresRange.value = 1;
  state.numMeasures = 4;
  measuresValEl.textContent = '4';

  // Onsets → 4
  onsetsRange.value = 4;
  state.numOnsets = 4;
  onsetsValEl.textContent = '4';

  // Density → 2
  densityRange.value = 2;
  state.chordDensity = 2;
  densityValEl.textContent = '2';

  // Spread → 5th (index 3 in new 7-interval array)
  spreadRange.value = 3;
  state.spreadIndex = 3;
  spreadValEl.textContent = '5';

  // Beat type → quarter note (index 2)
  beatRange.value = 2;
  state.beatType = BEAT_DURATIONS[2];
  beatValEl.textContent = BEAT_LABELS[2];

  // Key → C (index 0)
  keyRange.value = 0;
  state.keyIndex = 0;
  keyValEl.textContent = 'C';

  // All locks off
  lockMeasuresEl.checked = false; state.lockMeasures = false;
  lockOnsetsEl.checked   = false; state.lockOnsets   = false;
  lockDensityEl.checked  = false; state.lockDensity  = false;
  lockVoicingEl.checked  = false; state.lockVoicing  = false;
  lockBeatEl.checked     = false; state.lockBeat     = false;
  lockKeyEl.checked      = false; state.lockKey      = false;

  genreMenu.style.display = 'none';
});

// ── Init ──────────────────────────────────────────────────────
window.addEventListener('load', function () {
  renderStaff(null);
});

})();
</script>
</body>
</html>
